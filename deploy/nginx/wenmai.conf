# wenmai.ruoziqing.cn — 前端静态（SPA）+ Supabase API 同域路径
# API 与前端同域：*.ruoziqing.cn 通配符证书只覆盖一级子域，
# api.wenmai.ruoziqing.cn 是二级不被覆盖，故走路径而非子域。

server {
    listen 80;
    server_name wenmai.ruoziqing.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wenmai.ruoziqing.cn;

    ssl_certificate     /etc/nginx/ssl/ruoziqing/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ruoziqing/key.pem;

    client_max_body_size 60m;

    # GoTrue — 认证（strip /auth/v1 前缀）
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # PostgREST — 数据（strip /rest/v1 前缀）
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:5433/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Storage — 作品封面图
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5434;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    root /var/www/wenmai;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（文件名带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
